<script>
/**
 * App.js — router, shared state and the google.script.run wrapper.
 *
 * Two rules the views rely on:
 *   1. Every value that comes from the server is rendered through esc(); nothing
 *      is ever interpolated raw into innerHTML (SPEC §11, XSS).
 *   2. Views and Case Detail tabs register themselves, so a future module adds a
 *      tab without editing this file or any existing view (SPEC §10.5).
 */
var App = (function () {

  var state = {
    user: null,
    permissions: {},
    lists: {},
    statuses: [],
    hints: {},
    settings: {},
    buyers: [],
    route: { name: 'cases', param: null },
    ready: false
  };

  /** Shown when neither the activity type nor the sheet offers wording of its own. */
  var DEFAULT_HINT = 'สรุปสั้นๆ ว่าทำอะไร ได้ผลอย่างไร และขั้นตอนต่อไปคืออะไร';

  var views = {};
  var viewOrder = [];
  var caseTabs = [];
  var pending = 0;

  /* ------------------------------------------------------------ server calls */

  /**
   * A quiet call moves no progress bar and is not counted as work in flight.
   * Autosaving a draft happens while somebody is still typing: a flickering bar
   * would read as the page doing something to their form, and counting it would
   * keep the save button disabled between keystrokes.
   */
  function request(name, args, quiet) {
    if (!quiet) setBusy(1);
    return new Promise(function (resolve, reject) {
      function done() { if (!quiet) setBusy(-1); }
      google.script.run
        .withSuccessHandler(function (response) {
          done();
          if (!response) return reject({ code: 'INTERNAL', message: 'เซิร์ฟเวอร์ไม่ได้ตอบกลับ' });
          if (response.ok) return resolve(response.data);
          reject(response.error || { code: 'INTERNAL', message: 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ' });
        })
        .withFailureHandler(function (err) {
          done();
          reject({ code: 'INTERNAL', message: (err && err.message) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' });
        })[name].apply(null, args);
    });
  }

  function api(name) {
    return request(name, Array.prototype.slice.call(arguments, 1), false);
  }

  function setBusy(delta) {
    pending = Math.max(0, pending + delta);
    var bar = document.getElementById('busyBar');
    if (bar) bar.style.display = pending > 0 ? 'block' : 'none';
  }

  /** Runs fn once every in-flight server call has settled. */
  function whenIdle(fn) {
    if (pending === 0) {
      setTimeout(fn, 0);
      return;
    }
    var timer = setInterval(function () {
      if (pending > 0) return;
      clearInterval(timer);
      fn();
    }, 120);
  }

  /* -------------------------------------------------------------- formatting */

  /** Every control in a form, in document order. */
  function fieldsOf(form) {
    return Array.prototype.slice.call(form.querySelectorAll('input, select, textarea'));
  }

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /** dd/MM/yyyy in the Gregorian calendar (SPEC §3). */
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return fmtDate(iso) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** yyyy-MM-dd, the value format an <input type="date"> expects. */
  function toInputDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function fmtMoney(value) {
    if (value === null || value === undefined || value === '') return '';
    var n = Number(value);
    if (isNaN(n)) return '';
    return n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /** The active entries of one Config_Lists list, as the server sent them. */
  function listOf(listName) {
    return state.lists[listName] || [];
  }

  function hasCode(listName, code) {
    return listOf(listName).some(function (it) { return it.code === code; });
  }

  /** Thai label for a code, falling back to the code itself. */
  function labelOf(listName, code) {
    if (!code) return '';
    var items = listOf(listName);
    for (var i = 0; i < items.length; i++) {
      if (items[i].code === code) return items[i].label;
    }
    return code;
  }

  /**
   * The inverse of labelOf: a column pasted out of a BOQ holds "ตารางเมตร", not "SQM".
   * Matches the code first, then the Thai label, and hands back anything it does
   * not recognise so the preview can mark that row instead of silently blanking it.
   */
  function codeFromLabel(listName, text) {
    if (!text) return '';
    var wanted = String(text).trim();
    var folded = wanted.toUpperCase();
    var items = listOf(listName);
    for (var i = 0; i < items.length; i++) {
      if (String(items[i].code).toUpperCase() === folded) return items[i].code;
    }
    for (var j = 0; j < items.length; j++) {
      if (String(items[j].label).trim() === wanted) return items[j].code;
    }
    return wanted;
  }

  /**
   * The faint prompt inside the activity description box, which differs per
   * activity type: what a follow-up call should record is not what closing a
   * purchase should record.
   *
   * The text comes from Config_Settings so purchasing can reword it, and add it
   * for activity types that do not exist yet, without a deployment. "|" stands in
   * for a line break because a hint has to be typed into one spreadsheet cell,
   * and Alt+Enter is a step people forget.
   */
  function hintOf(code) {
    var text = (code && state.hints[code]) || state.hints.DEFAULT || DEFAULT_HINT;
    return String(text).split('|').join('\n');
  }

  function statusLabel(code) {
    for (var i = 0; i < state.statuses.length; i++) {
      if (state.statuses[i].code === code) return state.statuses[i].label;
    }
    return code || '';
  }

  function statusBadgeClass(code) {
    if (code === 'CANCELLED') return 'bad';
    if (code === 'CLOSED') return 'ok';
    return 'info';
  }

  /** <option> markup for a config list, optionally filtered by parent code. */
  function optionsFor(listName, selected, parentCode, placeholder) {
    var items = listOf(listName).filter(function (it) {
      if (parentCode === undefined || parentCode === null || parentCode === '') return true;
      return !it.parent || it.parent === parentCode;
    });
    var html = placeholder === false ? '' : '<option value="">' + esc(placeholder || '— เลือก —') + '</option>';
    items.forEach(function (it) {
      html += '<option value="' + esc(it.code) + '"' + (it.code === selected ? ' selected' : '') + '>' +
        esc(it.label) + '</option>';
    });
    return html;
  }

  /* --------------------------------------------------------------- messaging */

  function toast(message, kind) {
    var host = document.getElementById('toastHost');
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = message;
    host.appendChild(el);
    setTimeout(function () { el.remove(); }, kind === 'bad' ? 7000 : 3500);
  }

  /** Turns a server error envelope into something a buyer can act on. */
  function showError(error) {
    var e = error || {};
    if (e.code === 'CONFLICT') {
      toast('ข้อมูลถูกแก้ไขโดยผู้อื่น กรุณาโหลดใหม่', 'bad');
      return;
    }
    toast(e.message || 'เกิดข้อผิดพลาด', 'bad');
  }

  /** Renders blocking errors in red and non-blocking warnings in yellow (SPEC §8). */
  function alertHtml(kind, title, messages) {
    if (!messages || messages.length === 0) return '';
    var html = '<div class="alert ' + kind + '"><strong>' + esc(title) + '</strong><ul>';
    messages.forEach(function (m) { html += '<li>' + esc(m) + '</li>'; });
    return html + '</ul></div>';
  }

  function showWarnings(warnings) {
    (warnings || []).forEach(function (w) { toast(w, ''); });
  }

  /* ------------------------------------------------------------------ modal */

  /** Opens a modal. `build` returns HTML; `onSubmit(form, close)` handles the primary action. */
  function modal(options) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML =
      '<div class="modal' + (options.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
        '<div class="modal-header"><h3>' + esc(options.title) + '</h3>' +
          '<button type="button" class="subtle" data-close aria-label="ปิด">✕</button></div>' +
        '<form><div class="modal-body">' + options.body + '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" data-close>ยกเลิก</button>' +
          '<button type="submit" class="primary">' + esc(options.submitLabel || 'บันทึก') + '</button>' +
        '</div></form>' +
      '</div>';
    document.body.appendChild(backdrop);

    function close() { backdrop.remove(); }

    var form = backdrop.querySelector('form');
    var submitButton = form.querySelector('button[type="submit"]');

    // What the fields held once the dialog had finished opening. Anything that
    // differs from this is work the person would lose by closing.
    var baseline = null;
    function snapshot() {
      return fieldsOf(form).map(function (el) {
        return el.type === 'checkbox' || el.type === 'radio' ? String(el.checked) : el.value;
      }).join('\u0000');
    }
    function markClean() { baseline = snapshot(); }
    function isDirty() { return baseline !== null && snapshot() !== baseline; }

    function cancelAndClose() {
      if (options.onCancel) options.onCancel();
      close();
    }

    /**
     * Closing by hand. A dialog nobody has typed into closes without comment —
     * asking there would be noise on every glance at a read-only dialog.
     *
     * The question is asked with this app's own dialog rather than confirm(),
     * which the Apps Script frame is free to suppress: a suppressed confirm reads
     * as "no", and a form that has been typed into would then refuse to close at all.
     */
    function requestClose() {
      if (!isDirty()) {
        cancelAndClose();
        return;
      }
      confirmAction('ปิดหน้าต่างนี้?', 'ข้อมูลที่กรอกไว้จะหายไป', 'ปิดหน้าต่าง')
        .then(function (ok) { if (ok) cancelAndClose(); });
    }

    backdrop.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = requestClose; });

    // A click fires on the nearest common ancestor of where the button went down
    // and where it came up. Selecting text in a field and releasing a few pixels
    // past the edge of the dialog therefore reports the backdrop as its target —
    // which used to throw the whole form away, with no click the person was aware
    // of making. Both halves of the gesture have to land on the backdrop.
    var pressedOnBackdrop = false;
    backdrop.addEventListener('mousedown', function (e) {
      pressedOnBackdrop = e.target === backdrop;
    });
    backdrop.onclick = function (e) {
      if (e.target === backdrop && pressedOnBackdrop) requestClose();
    };

    form.onsubmit = function (e) {
      e.preventDefault();
      // Pressing save again while the first request is still in flight sends a
      // second one. Each is a separate server execution creating its own record,
      // so an impatient double-click quietly produces duplicate work. The button
      // stays disabled until everything in flight has settled.
      if (submitButton.disabled) return;
      submitButton.disabled = true;
      options.onSubmit(form, close);
      whenIdle(function () {
        if (document.body.contains(backdrop)) submitButton.disabled = false;
      });
    };
    if (options.onOpen) options.onOpen(form, close);
    markClean();
    var first = form.querySelector('input, select, textarea');
    if (first) first.focus();
    return { close: close, form: form, markClean: markClean };
  }

  /**
   * Prompts for the reason the spec requires before price edits, status reversals,
   * deletions, reassignment, exceptions and reopen (SPEC §6.3).
   */
  function askReason(title, message) {
    return new Promise(function (resolve) {
      modal({
        title: title,
        submitLabel: 'ยืนยัน',
        body: (message ? '<p class="muted">' + esc(message) + '</p>' : '') +
          '<div class="field"><label for="reasonInput">เหตุผล <span class="req">*</span></label>' +
          '<textarea id="reasonInput" name="reason" required maxlength="500" ' +
          'placeholder="ระบุเหตุผลเพื่อบันทึกไว้ในประวัติการแก้ไข"></textarea></div>',
        onSubmit: function (form, close) {
          var reason = form.reason.value.trim();
          if (!reason) return;
          close();
          resolve(reason);
        }
      });
    });
  }

  function confirmAction(title, message, confirmLabel) {
    return new Promise(function (resolve) {
      // Every way out of the dialog has to answer. Wiring "no" to the buttons
      // alone left the backdrop as a silent exit: the promise never settled and
      // whatever was waiting on the answer simply never ran, with nothing shown.
      modal({
        title: title,
        submitLabel: confirmLabel || 'ยืนยัน',
        body: '<p>' + esc(message) + '</p>',
        onSubmit: function (form, close) { close(); resolve(true); },
        onCancel: function () { resolve(false); }
      });
    });
  }

  /* --------------------------------------------------------------- combobox */

  /**
   * A text box that searches as you type and hands back an id.
   *
   * A plain <select> has to hold the whole register before the user can pick
   * anything, which stops working the moment the register outgrows the server's
   * result cap: the entries past the cap become unreachable rather than merely
   * inconvenient. Searching server-side has no such ceiling.
   *
   * The visible box is deliberately not the field that submits. The form reads a
   * hidden input that only a real selection ever writes to, so a half-typed name
   * cannot be mistaken for a choice — the server would reject the name anyway,
   * and it would reject it after the buyer had already written their note.
   *
   *   body:   App.combobox.html({ name: 'Vendor_ID', placeholder: '…', text: '…', value: '…' })
   *   onOpen: App.combobox.wire(form, { name: 'Vendor_ID', search: fn, emptyText: '…' })
   *
   * `search(query)` returns a Promise of [{ id, label, hint }].
   *
   * The visible box carries id "<name>__input" so a <label for> can point at it.
   * It must not take the id "<name>": a form element is reachable by id as well as
   * by name, so that would make form.<name> a RadioNodeList whose .value is always
   * empty, and every selection would submit as blank.
   */
  var combobox = (function () {

    var DEBOUNCE_MS = 200;
    var MAX_RESULTS = 20;

    function html(options) {
      var o = options || {};
      return '<div class="combo" data-combo="' + esc(o.name) + '">' +
        '<input type="text" class="combo-input" id="' + esc(o.name) + '__input" ' +
          'autocomplete="off" role="combobox" ' +
          'aria-expanded="false" aria-autocomplete="list" ' +
          'placeholder="' + esc(o.placeholder || 'พิมพ์เพื่อค้นหา…') + '" ' +
          'value="' + esc(o.text || '') + '">' +
        '<input type="hidden" name="' + esc(o.name) + '" value="' + esc(o.value || '') + '">' +
        '<ul class="combo-list" role="listbox" hidden></ul>' +
        '<div class="combo-note" hidden></div>' +
        '</div>';
    }

    function wire(form, options) {
      var o = options || {};
      var root = form.querySelector('[data-combo="' + o.name + '"]');
      if (!root) return;                       // the field is not on this form

      var input = root.querySelector('.combo-input');
      var hidden = root.querySelector('input[type="hidden"]');
      var list = root.querySelector('.combo-list');
      var note = root.querySelector('.combo-note');

      var items = [];
      var active = -1;
      var timer = null;
      var seq = 0;                             // only the newest query may paint
      var chosenText = input.value.trim();     // what the current id was picked as

      function setNote(message) {
        note.textContent = message || '';
        note.hidden = !message;
      }

      function close() {
        list.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        active = -1;
      }

      function paint() {
        if (!items.length) {
          close();
          return;
        }
        list.innerHTML = items.map(function (item, i) {
          return '<li class="combo-item" role="option" data-index="' + i + '" ' +
            'aria-selected="' + (i === active) + '">' + esc(item.label) +
            (item.hint ? '<span class="faint"> · ' + esc(item.hint) + '</span>' : '') + '</li>';
        }).join('');
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
      }

      function choose(i) {
        var item = items[i];
        if (!item) return;
        hidden.value = item.id;
        input.value = item.label;
        chosenText = input.value.trim();
        setNote('');
        close();
      }

      /** Anything other than an untouched selection means "nothing is chosen". */
      function clearChoice() {
        hidden.value = '';
        chosenText = '';
      }

      function run(query) {
        var mine = ++seq;
        o.search(query).then(function (results) {
          if (mine !== seq) return;            // a later keystroke already won
          items = (results || []).slice(0, MAX_RESULTS);
          active = -1;
          paint();
          setNote(!items.length && query ? (o.emptyText || 'ไม่พบรายการที่ตรงกับคำค้น') : '');
        }).catch(function () {
          if (mine !== seq) return;
          items = [];
          close();
          setNote('ค้นหาไม่สำเร็จ กรุณาลองใหม่');
        });
      }

      function schedule() {
        if (timer) clearTimeout(timer);
        var query = input.value.trim();
        timer = setTimeout(function () { run(query); }, DEBOUNCE_MS);
      }

      input.addEventListener('input', function () {
        clearChoice();
        setNote('');
        schedule();
      });

      input.addEventListener('focus', function () {
        if (items.length) paint(); else run(input.value.trim());
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { close(); return; }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          if (!items.length) return;
          e.preventDefault();
          if (list.hidden) { paint(); return; }   // Escape closed it; reopen first
          active = e.key === 'ArrowDown'
            ? Math.min(active + 1, items.length - 1)
            : Math.max(active - 1, 0);
          paint();
          var el = list.querySelector('[data-index="' + active + '"]');
          if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
          return;
        }
        if (e.key === 'Enter' && !list.hidden && active >= 0) {
          e.preventDefault();                  // Enter picks, it does not submit
          choose(active);
        }
      });

      // mousedown, not click: blur fires first and would close the list under the pointer.
      list.addEventListener('mousedown', function (e) {
        var li = e.target.closest('[data-index]');
        if (!li) return;
        e.preventDefault();
        choose(Number(li.dataset.index));
      });

      input.addEventListener('blur', function () {
        setTimeout(function () {
          // Switching tab or window blurs the field too, and somebody who has
          // gone to look something up has not abandoned what they were typing —
          // they are coming back to it. Only a blur that moves focus elsewhere on
          // this page means they are done with the field.
          if (document.hidden || !document.hasFocus()) return;
          close();
          // Text left behind that was never chosen is not a selection. Clearing it
          // is what makes the empty box honest: nothing was picked.
          if (input.value.trim() !== chosenText) {
            var typed = input.value.trim();
            clearChoice();
            input.value = '';
            if (typed) setNote(o.emptyText || 'ยังไม่ได้เลือกจากรายการ');
          }
        }, 120);
      });
    }

    return { html: html, wire: wire };
  })();

  /* ------------------------------------------------- views and case-detail tabs */

  /** view = { id, label, roles?, visible?(state), render(container, param) } */
  function registerView(view) {
    views[view.id] = view;
    if (viewOrder.indexOf(view.id) === -1) viewOrder.push(view.id);
  }

  /**
   * Extension point (SPEC §10.5): a new module calls this from its own
   * view file and its tab appears in Case Detail without touching an existing tab.
   * tab = { id, label, order?, visible?(ctx), render(container, ctx) }
   */
  function registerCaseTab(tab) {
    caseTabs.push(tab);
    caseTabs.sort(function (a, b) { return (a.order || 100) - (b.order || 100); });
  }

  function getCaseTabs(ctx) {
    return caseTabs.filter(function (t) { return !t.visible || t.visible(ctx); });
  }

  /* ----------------------------------------------------------------- routing */

  function parseHash() {
    var raw = (location.hash || '#/cases').replace(/^#\/?/, '');
    var parts = raw.split('/');
    return { name: parts[0] || 'cases', param: parts[1] ? decodeURIComponent(parts[1]) : null };
  }

  function go(path) {
    location.hash = '#/' + path;
  }

  function navigate() {
    state.route = parseHash();
    var view = views[state.route.name] || views.cases;
    renderNav();
    var host = document.getElementById('app');
    host.innerHTML = '<div class="loading"><span class="spinner"></span> กำลังโหลด…</div>';
    try {
      view.render(host, state.route.param);
    } catch (e) {
      host.innerHTML = '<div class="alert error">แสดงผลไม่สำเร็จ: ' + esc(e.message) + '</div>';
    }
  }

  function renderNav() {
    var nav = document.getElementById('mainNav');
    var html = '';
    viewOrder.forEach(function (id) {
      var view = views[id];
      if (view.hidden) return;
      if (view.visible && !view.visible(state)) return;
      var current = state.route.name === id ? ' aria-current="page"' : '';
      html += '<button type="button" data-view="' + esc(id) + '"' + current + '>' + esc(view.label) + '</button>';
    });
    nav.innerHTML = html;
    nav.querySelectorAll('[data-view]').forEach(function (b) {
      b.onclick = function () { go(b.dataset.view); };
    });
  }

  /* ------------------------------------------------------------------- drafts */

  /**
   * Keeps a dialog's contents alive across anything that takes the page away.
   *
   * `kind` names the form, `scope` separates drafts of the same form that must not
   * bleed into one another — one per Case, say. Both are sent to the server, which
   * decides whose draft this is; the browser never says who it is.
   *
   * Nothing here saves a record. A draft that is never restored simply expires.
   */
  function draft(kind, scope) {
    var DEBOUNCE_MS = 2000;
    var timer = null;
    var lastSent = null;
    var inFlight = null;

    function read(form) {
      var fields = {};
      fieldsOf(form).forEach(function (el) {
        if (!el.name) return;
        fields[el.name] = el.type === 'checkbox' ? !!el.checked : el.value;
      });
      // A combobox submits a hidden id, but what the person sees — and would have
      // to find again — is the name in the visible box. Restore both or the field
      // comes back looking empty while holding a value.
      var combos = {};
      form.querySelectorAll('[data-combo]').forEach(function (box) {
        var name = box.getAttribute('data-combo');
        var visible = box.querySelector('.combo-input');
        if (name && visible) combos[name] = visible.value;
      });
      return { fields: fields, combos: combos };
    }

    function fill(form, fields) {
      var restored = false;
      fieldsOf(form).forEach(function (el) {
        if (!el.name || !Object.prototype.hasOwnProperty.call(fields, el.name)) return;
        var value = fields[el.name];
        if (el.type === 'checkbox') el.checked = !!value;
        else el.value = value === null || value === undefined ? '' : value;
        if (el.type === 'checkbox' ? el.checked : String(el.value) !== '') restored = true;
      });
      return restored;
    }

    /**
     * Filling the form takes two passes, because some dropdowns only exist in
     * terms of another: a sub type cannot be selected until the budget type above
     * it has rebuilt the list the sub type belongs to. The first pass sets what it
     * can, the change events let each dependent list rebuild itself, and the
     * second pass puts back what had nowhere to go the first time round.
     */
    function write(form, data) {
      if (!data || !data.fields) return false;

      fill(form, data.fields);
      fieldsOf(form).forEach(function (el) {
        if (el.tagName === 'SELECT' && el.name && data.fields[el.name]) {
          el.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      var restored = fill(form, data.fields);

      Object.keys(data.combos || {}).forEach(function (name) {
        var visible = form.querySelector('[data-combo="' + name + '"] .combo-input');
        if (visible) visible.value = data.combos[name];
      });
      return restored;
    }

    return {
      /** Fills the form in. Resolves true only if something was actually put back. */
      restore: function (form) {
        return request('api_loadDraft', [kind, scope], true)
          .then(function (data) { return write(form, data.draft); })
          .catch(function () { return false; });
      },

      /**
       * Saves a couple of seconds after typing stops, so a long form costs a
       * handful of calls rather than one per keystroke.
       */
      watch: function (form) {
        function schedule() {
          if (timer) clearTimeout(timer);
          timer = setTimeout(function () {
            var values = read(form);
            var snapshot = JSON.stringify(values);
            if (snapshot === lastSent) return;
            lastSent = snapshot;
            inFlight = request('api_saveDraft', [kind, scope, values], true).catch(function () {});
          }, DEBOUNCE_MS);
        }
        form.addEventListener('input', schedule);
        form.addEventListener('change', schedule);
      },

      /**
       * Throws the draft away, and waits for any save already on its way so that
       * one cannot land afterwards and bring the discarded draft back.
       *
       * Watching continues: this is also what "start over" does, and whatever is
       * typed next deserves keeping just as much.
       */
      clear: function () {
        if (timer) clearTimeout(timer);
        lastSent = null;
        return (inFlight || Promise.resolve())
          .then(function () { return request('api_clearDraft', [kind, scope], true); })
          .catch(function () {});
      }
    };
  }

  /* ------------------------------------------------------------------ startup */

  function start() {
    api('api_bootstrap').then(function (data) {
      state.user = data.user;
      state.permissions = data.permissions;
      state.lists = data.lists;
      state.statuses = data.statuses;
      state.hints = data.hints || {};
      state.settings = data.settings;
      state.buyers = data.buyers;
      state.ready = true;
      window.addEventListener('hashchange', navigate);
      navigate();
    }).catch(function (error) {
      document.getElementById('app').innerHTML =
        '<div class="alert error"><strong>เข้าใช้งานไม่ได้</strong><br>' + esc(error.message) + '</div>';
    });
  }

  return {
    state: state,
    api: api,
    esc: esc,
    fmtDate: fmtDate,
    fmtDateTime: fmtDateTime,
    toInputDate: toInputDate,
    fmtMoney: fmtMoney,
    listOf: listOf,
    hasCode: hasCode,
    labelOf: labelOf,
    codeFromLabel: codeFromLabel,
    draft: draft,
    hintOf: hintOf,
    statusLabel: statusLabel,
    statusBadgeClass: statusBadgeClass,
    optionsFor: optionsFor,
    toast: toast,
    showError: showError,
    showWarnings: showWarnings,
    alertHtml: alertHtml,
    modal: modal,
    askReason: askReason,
    combobox: combobox,
    confirmAction: confirmAction,
    registerView: registerView,
    registerCaseTab: registerCaseTab,
    getCaseTabs: getCaseTabs,
    go: go,
    navigate: navigate,
    start: start
  };
})();
</script>
